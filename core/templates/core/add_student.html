{% extends "core/base.html" %}

{% block title %}
Add Student | Student Performance AI
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="mb-4">

            <a href="/" class="text-decoration-none">
                <i class="bi bi-arrow-left"></i>
                Back to Students
            </a>

        </div>


        <div class="custom-card p-4 p-md-5">

            <div class="mb-4">

                <h2 class="page-title">
                    <i class="bi bi-person-plus text-primary me-2"></i>
                    Add Student
                </h2>

                <p class="page-subtitle mb-0">
                    Create a new student record.
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            placeholder="Enter age"
                            min="1"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Marks
                        </label>

                        <input
                            type="number"
                            name="marks"
                            class="form-control"
                            placeholder="Enter marks"
                            min="0"
                            max="100"
                            required
                        >

                    </div>

                </div>


                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        City
                    </label>

                    <input
                        type="text"
                        name="city"
                        class="form-control"
                        placeholder="Enter city"
                        required
                    >

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary px-4"
                    >
                        <i class="bi bi-check-circle me-1"></i>
                        Save Student
                    </button>

                    <a
                        href="/"
                        class="btn btn-outline-secondary px-4"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
