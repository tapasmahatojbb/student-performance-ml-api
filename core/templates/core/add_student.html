<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>

<body>

<h1>Add Student</h1>

<form method="POST">

    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name">

    <br><br>

    <label>Age:</label>
    <input type="number" name="age">

    <br><br>

    <label>City:</label>
    <input type="text" name="city">

    <br><br>

    <label>Marks:</label>
    <input type="number" name="marks">

    <br><br>

    <button type="submit">Save Student</button>

</form>

</body>
</html>
