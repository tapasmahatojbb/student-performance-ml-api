<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>

<body>

<h1>Edit Student</h1>

<form method="POST">

    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ student.name }}">

    <br><br>

    <label>Age:</label>
    <input type="number" name="age" value="{{ student.age }}">

    <br><br>

    <label>City:</label>
    <input type="text" name="city" value="{{ student.city }}">

    <br><br>

    <label>Marks:</label>
    <input type="number" name="marks" value="{{ student.marks }}">

    <br><br>

    <button type="submit">Update Student</button>

</form>

</body>
</html>
